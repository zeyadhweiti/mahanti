<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة مهنتي - البحث عن العمال والدخول المباشر</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
            text-align: center;
            transition: all 0.3s ease;
        }
        h2 { color: #1e3a8a; margin-bottom: 10px; }
        p.subtitle { color: #64748b; font-size: 14px; margin-bottom: 20px; }
        
        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #e2e8f0;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: none;
            font-size: 15px;
            font-weight: bold;
            color: #64748b;
            cursor: pointer;
            transition: 0.3s;
        }
        .tab-btn.active {
            color: #10b981;
            border-bottom: 3px solid #10b981;
        }

        .btn {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            transition: 0.3s;
        }
        .btn:hover { background-color: #059669; }
        
        input, select {
            width: 100%;
            padding: 11px;
            margin: 6px 0 12px 0;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
            background-color: #fff;
        }
        label {
            display: block;
            text-align: right;
            font-weight: bold;
            font-size: 14px;
            color: #334155;
        }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .worker-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
            text-align: right;
        }
        .worker-card strong { color: #1e3a8a; }
        .action-btns {
            display: flex;
            gap: 8px;
            margin-top: 10px;
        }
        .btn-call {
            background-color: #2563eb;
            color: white;
            text-decoration: none;
            padding: 8px;
            border-radius: 5px;
            flex: 1;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
        }
        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            text-decoration: none;
            padding: 8px;
            border-radius: 5px;
            flex: 1;
            text-align: center;
            font-size: 13px;
            font-weight: bold;
        }
        
        .dashboard-active {
            background: linear-gradient(135deg, #059669 0%, #10b981 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
        }
        .dashboard-active h2 { color: #ffffff; }
        .feature-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 12px;
            text-align: right;
            font-size: 14px;
        }
        .btn-light { background-color: #ffffff; color: #047857; font-weight: bold; }
        .btn-danger-light {
            background-color: rgba(239, 68, 68, 0.2);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.4);
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container" id="mainContainer">
    
    <!-- التبويبات الرئيسية -->
    <div class="tabs" id="mainTabs">
        <button class="tab-btn active" onclick="switchTab('search')">🔍 البحث عن عمال</button>
        <button class="tab-btn" onclick="switchTab('login')">🛠️ دخول المهنيين</button>
    </div>

    <!-- التبويب 1: صفحة البحث عن العمال -->
    <div id="tab-search" class="tab-content active">
        <h2>🔍 ابحث عن حرفي أو عامل</h2>
        <p class="subtitle">اختر الدولة والمدينة والمهنة للوصول الفوري للعمال</p>

        <label>اختر الدولة:</label>
        <select id="searchCountry" onchange="updateSearchCities()">
            <option value="">-- اختر الدولة --</option>
        </select>

        <label>اختر المدينة:</label>
        <select id="searchCity">
            <option value="">-- اختر المدينة --</option>
        </select>

        <label>اختر المهنة المطلوب البحث عنها:</label>
        <select id="searchJob" onchange="toggleOtherJobInput('searchJob', 'searchOtherJobContainer')">
            <option value="">-- جميع المهن --</option>
            <option value="سباك">سباك / صحي</option>
            <option value="كهربائي">كهربائي</option>
            <option value="نجار">نجار</option>
            <option value="دهان">دهان / نقاش</option>
            <option value="فني تكييف">فني تكييف وتبريد</option>
            <option value="عامل بناء">عامل بناء / بنّاء</option>
            <option value="مبلط">مبلط / سيراميك</option>
            <option value="حداد">حداد</option>
            <option value="ألومنيوم">فني ألومنيوم / زجاج</option>
            <option value="جبس بورد">فني ديكور / جبس بورد</option>
            <option value="مصلح أجهزة">مصلح أدوات منزلية وأجهزة</option>
            <option value="ميكانيكي">ميكانيكي سيارات</option>
            <option value="كهربائي سيارات">كهربائي سيارات</option>
            <option value="بنشري">بنشري / إطارات</option>
            <option value="سائق">سائق / توصيل</option>
            <option value="مزارع">مزارع / تنسيق حدائق</option>
            <option value="عامل نظافة">عامل / عاملة نظافة</option>
            <option value="خياط">خياط / تنجيد</option>
            <option value="طباخ">طباخ / صانع حلويات</option>
            <option value="حلاق">حلاق / كوافير</option>
            <option value="أخرى">أخرى (أدخل المهنة)</option>
        </select>

        <div id="searchOtherJobContainer" style="display: none;">
            <label>اكتب المهنة:</label>
            <input type="text" id="searchOtherJobText" placeholder="أدخل اسم المهنة المطلوبة...">
        </div>

        <button class="btn" onclick="performSearch()">🔍 بحث عن العمال المتاحين</button>

        <div id="searchResults" style="margin-top: 15px;"></div>
    </div>

    <!-- التبويب 2: تسجيل دخول المهنيين -->
    <div id="tab-login" class="tab-content">
        <h2>🛠️ تسجيل دخول مهني</h2>
        <p class="subtitle">سجل دخولك المباشر لتظهر في قائمة البحث للعملاء</p>

        <label>اختر المهنة / التخصص:</label>
        <select id="jobSelect" onchange="toggleOtherJobInput('jobSelect', 'loginOtherJobContainer')">
            <option value="">-- اختر المهنة --</option>
            <option value="سباك">سباك / صحي</option>
            <option value="كهربائي">كهربائي</option>
            <option value="نجار">نجار</option>
            <option value="دهان">دهان / نقاش</option>
            <option value="فني تكييف">فني تكييف وتبريد</option>
            <option value="عامل بناء">عامل بناء / بنّاء</option>
            <option value="مبلط">مبلط / سيراميك</option>
            <option value="حداد">حداد</option>
            <option value="ألومنيوم">فني ألومنيوم / زجاج</option>
            <option value="جبس بورد">فني ديكور / جبس بورد</option>
            <option value="مصلح أجهزة">مصلح أدوات منزلية وأجهزة</option>
            <option value="ميكانيكي">ميكانيكي سيارات</option>
            <option value="كهربائي سيارات">كهربائي سيارات</option>
            <option value="بنشري">بنشري / إطارات</option>
            <option value="سائق">سائق / توصيل</option>
            <option value="مزارع">مزارع / تنسيق حدائق</option>
            <option value="عامل نظافة">عامل / عاملة نظافة</option>
            <option value="خياط">خياط / تنجيد</option>
            <option value="طباخ">طباخ / صانع حلويات</option>
            <option value="حلاق">حلاق / كوافير</option>
            <option value="أخرى">أخرى (أدخل المهنة)</option>
        </select>

        <div id="loginOtherJobContainer" style="display: none;">
            <label>اكتب مهنتك:</label>
            <input type="text" id="loginOtherJobText" placeholder="أدخل اسم مهنتك...">
        </div>

        <label>اختر الدولة:</label>
        <select id="countrySelect" onchange="updateCities()">
            <option value="">-- اختر الدولة --</option>
        </select>

        <label>اختر المدينة:</label>
        <select id="citySelect">
            <option value="">-- اختر المدينة --</option>
        </select>

        <label>رقم هاتف المهني:</label>
        <input type="tel" id="craftsmanPhone" placeholder="أدخل رقم هاتفك">

        <button class="btn" onclick="directLogin()">🚀 دخول وحفظ الحساب</button>
    </div>

    <!-- واجهة لوحة تحكم المهني الخضراء -->
    <div id="step-dashboard" class="tab-content">
        <h2>🛠️ لوحة تحكم المهني</h2>
        <div style="margin-bottom: 12px;">
            <span style="background-color: #d1fae5; color: #065f46; padding: 4px 12px; border-radius: 20px; font-size: 13px; font-weight: bold;">🟢 حسابك متاح في نتائج البحث</span>
        </div>

        <div class="feature-card">
            <strong>📱 رقم الهاتف:</strong> <span id="dashPhone"></span><br>
            <strong>🛠️ المهنة:</strong> <span id="dashJob"></span><br>
            <strong>📍 الموقع:</strong> <span id="dashLocation"></span>
        </div>

        <div class="feature-card">
            <strong>📍 حالة التواجد:</strong>
            <select id="workStatus" style="margin-top:5px; color:#333;">
                <option value="active">🟢 متاح للعمل واستقبال الاتصالات</option>
                <option value="busy">🔴 مشغول حالياً</option>
            </select>
        </div>

        <button class="btn btn-light" onclick="alert('حسابك متاح ومفعل في نتائج البحث!')">🔄 تحديث الحالة</button>
        <button class="btn btn-danger-light" onclick="logout()">تسجيل الخروج</button>
    </div>

</div>

<script>
    const arabCountries = {
        "الأردن": ["عمان", "الزرقاء", "إربد", "العقبة", "البلقاء", "المفرق", "جرش", "عجلون", "مأدبا", "الكرك", "الطفيلة", "معان"],
        "السعودية": ["الرياض", "جدة", "مكة المكرمة", "المدينة المنورة", "الدمام", "الخبر", "أبها", "تبوك", "حائل", "القصيم"],
        "مصر": ["القاهرة", "الجيزة", "الإسكندرية", "المنصورة", "طنطا", "أسيوط", "سوهاج", "الأقصر", "أسوان"],
        "الإمارات": ["أبوظبي", "دبي", "الشارقة", "عجمان", "رأس الخيمة", "الفجيرة", "أم القيوين"],
        "الكويت": ["الكويت العاصمة", "الأحمدي", "حولي", "الفروانية", "الجهراء"],
        "قطر": ["الدوحة", "الريان", "الوكرة", "الخور"],
        "البحرين": ["المنامة", "المحرق", "الرفاع"],
        "عُمان": ["مسقط", "صلالة", "صحار", "نزوى"],
        "العراق": ["بغداد", "البصرة", "أربيل", "الموصل", "النجف"],
        "سوريا": ["دمشق", "حلب", "حمص", "اللاذقية"],
        "لبنان": ["بيروت", "طرابلس", "صيدا"],
        "فلسطين": ["القدس", "رام الله", "غزة", "نابلس", "الخليل"],
        "اليمن": ["صنعاء", "عدن", "تعز"],
        "السودان": ["الخرطوم", "أم درمان", "بورتسودان"],
        "ليبيا": ["طرابلس", "بنغازي", "مصراتة"],
        "الجزائر": ["الجزائر العاصمة", "وهران", "قسنطينة"],
        "المغرب": ["الرباط", "الدار البيضاء", "مراكش", "فاس"],
        "تونس": ["تونس العاصمة", "صفاقس", "سوسة"],
        "موريتانيا": ["نواكشوط", "نواذيبو"],
        "الصومال": ["مقديشو", "هرجيسا"],
        "جيبوتي": ["جيبوتي العاصمة"],
        "جزر القمر": ["موروني"]
    };

    const dummyWorkers = [
        { name: "أحمد العلي", job: "سباك", country: "الأردن", city: "العقبة", phone: "0777411458" },
        { name: "محمد حسن", job: "كهربائي", country: "الأردن", city: "عمان", phone: "0791234567" },
        { name: "خالد منصور", job: "نجار", country: "السعودية", city: "الرياض", phone: "0501234567" },
        { name: "علي علي", job: "سباك", country: "اليمن", city: "صنعاء", phone: "0777411458" }
    ];

    window.onload = function() {
        populateCountries('searchCountry');
        populateCountries('countrySelect');

        const savedUser = localStorage.getItem('mahantiDirectUser');
        if (savedUser) {
            displayDashboard(JSON.parse(savedUser));
        }
    };

    function populateCountries(selectId) {
        const select = document.getElementById(selectId);
        for (let country in arabCountries) {
            let option = document.createElement('option');
            option.value = country;
            option.textContent = country;
            select.appendChild(option);
        }
    }

    function updateSearchCities() {
        updateCitiesGeneric('searchCountry', 'searchCity');
    }

    function updateCities() {
        updateCitiesGeneric('countrySelect', 'citySelect');
    }

    function updateCitiesGeneric(countryId, cityId) {
        const country = document.getElementById(countryId).value;
        const citySelect = document.getElementById(cityId);
        citySelect.innerHTML = '<option value="">-- اختر المدينة --</option>';

        if (country && arabCountries[country]) {
            arabCountries[country].forEach(city => {
                let option = document.createElement('option');
                option.value = city;
                option.textContent = city;
                citySelect.appendChild(option);
            });
        }
    }

    // إظهار وإخفاء حقل المهن الأخرى عند اختيار "أخرى"
    function toggleOtherJobInput(selectId, containerId) {
        const selectVal = document.getElementById(selectId).value;
        const container = document.getElementById(containerId);
        if (selectVal === 'أخرى') {
            container.style.display = 'block';
        } else {
            container.style.display = 'none';
        }
    }

    function switchTab(tabName) {
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

        if (tabName === 'search') {
            document.querySelectorAll('.tab-btn')[0].classList.add('active');
            document.getElementById('tab-search').classList.add('active');
        } else if (tabName === 'login') {
            document.querySelectorAll('.tab-btn')[1].classList.add('active');
            document.getElementById('tab-login').classList.add('active');
        }
    }

    function performSearch() {
        const country = document.getElementById('searchCountry').value;
        const city = document.getElementById('searchCity').value;
        let job = document.getElementById('searchJob').value;
        if (job === 'أخرى') {
            job = document.getElementById('searchOtherJobText').value.trim();
        }

        const resultsDiv = document.getElementById('searchResults');
        resultsDiv.innerHTML = '';

        if (!country) {
            alert('يرجى اختيار الدولة على الأقل للبحث.');
            return;
        }

        let allWorkers = [...dummyWorkers];
        const savedUser = localStorage.getItem('mahantiDirectUser');
        if (savedUser) {
            const user = JSON.parse(savedUser);
            allWorkers.unshift({
                name: "مهني مسجل حديثاً",
                job: user.job,
                country: user.country,
                city: user.city,
                phone: user.phone
            });
        }

        const filtered = allWorkers.filter(w => {
            const matchCountry = w.country === country;
            const matchCity = !city || w.city === city;
            const matchJob = !job || w.job.toLowerCase().includes(job.toLowerCase());
            return matchCountry && matchCity && matchJob;
        });

        if (filtered.length === 0) {
            resultsDiv.innerHTML = '<p style="color: #ef4444; font-weight: bold; margin-top: 15px;">عفواً، لا يوجد عمال متاحون حالياً بهذا البحث.</p>';
            return;
        }

        filtered.forEach(w => {
            const card = document.createElement('div');
            card.className = 'worker-card';
            card.innerHTML = `
                <strong>🛠️ المهنة:</strong> ${w.job}<br>
                <strong>👤 الاسم:</strong> ${w.name}<br>
                <strong>📍 الموقع:</strong> ${w.country} - ${w.city}<br>
                <strong>📱 الهاتف:</strong> ${w.phone}
                <div class="action-btns">
                    <a href="tel:${w.phone}" class="btn-call">📞 اتصال مباشر</a>
                    <a href="https://wa.me/${w.phone}" target="_blank" class="btn-whatsapp">💬 واتساب</a>
                </div>
            `;
            resultsDiv.appendChild(card);
        });
    }

    function directLogin() {
        let job = document.getElementById('jobSelect').value;
        if (job === 'أخرى') {
            job = document.getElementById('loginOtherJobText').value.trim();
        }

        const country = document.getElementById('countrySelect').value;
        const city = document.getElementById('citySelect').value;
        const phone = document.getElementById('craftsmanPhone').value.trim();

        if (!job || !country || !city || !phone) {
            alert('يرجى ملء جميع الحقول لتسجيل الدخول.');
            return;
        }

        const userData = { job: job, country: country, city: city, phone: phone };
        localStorage.setItem('mahantiDirectUser', JSON.stringify(userData));
        displayDashboard(userData);
    }

    function displayDashboard(userData) {
        document.getElementById('mainTabs').style.display = 'none';
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        document.getElementById('step-dashboard').classList.add('active');
        document.getElementById('mainContainer').classList.add('dashboard-active');

        document.getElementById('dashPhone').innerText = userData.phone;
        document.getElementById('dashJob').innerText = userData.job;
        document.getElementById('dashLocation').innerText = `${userData.country} - ${userData.city}`;
    }

    function logout() {
        localStorage.removeItem('mahantiDirectUser');
        document.getElementById('mainContainer').classList.remove('dashboard-active');
        document.getElementById('step-dashboard').classList.remove('active');
        document.getElementById('mainTabs').style.display = 'flex';
        switchTab('search');
    }
</script>

</body>
</html>
