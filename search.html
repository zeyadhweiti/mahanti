<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>البحث عن العمال - مهنتي</title>
    <meta name="description" content="ابحث عن أصحاب المهن الحرفية في مدينتك">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-icon">🔍</div>
            <div class="app-title">البحث عن العمال</div>
            <div class="app-subtitle">ابحث بالمهنة أو المدينة أو اسم العامل</div>
        </header>

        <!-- Navigation -->
        <nav class="nav-tabs">
            <a href="search.html" class="nav-tab active">🔍 البحث</a>
            <a href="register.html" class="nav-tab">📝 التسجيل</a>
            <a href="index.html" class="nav-tab">🏠 الرئيسية</a>
        </nav>

        <!-- Content -->
        <main class="content-area fade-in">
            <!-- Search Box -->
            <div class="search-box">
                <span class="search-icon">🔍</span>
                <input type="text" class="search-input" placeholder="ابحث باسم المهنة أو العامل..." id="searchInput" oninput="filterWorkers()">
            </div>

            <!-- Country & City Filters -->
            <div class="form-group" style="display: flex; gap: 10px; margin-bottom: 16px;">
                <select class="form-select" id="countryFilter" onchange="updateCitiesOptions()">
                    <option value="">🌍 جميع الدول</option>
                    <option value="JO">🇯🇴 الأردن</option>
                    <option value="SA">🇸🇦 السعودية</option>
                    <option value="EG">🇪🇬 مصر</option>
                    <option value="AE">🇦🇪 الإمارات</option>
                </select>

                <select class="form-select" id="cityFilter" onchange="filterWorkers()">
                    <option value="">📍 جميع المدن</option>
                </select>
            </div>

            <!-- Workers List Container -->
            <div id="workersList">
                <div id="loading" style="text-align: center; padding: 20px;">جاري تحميل العمال... ⏳</div>
            </div>

            <!-- No Results Message -->
            <div id="noResults" style="display:none; text-align:center; padding:40px 20px; color:var(--text-gray);">
                <div style="font-size:48px; margin-bottom:12px;">😕</div>
                <h3 style="color:var(--primary-green); margin-bottom:8px;">لا توجد نتائج</h3>
                <p>جرب البحث بكلمات مختلفة أو تصفية أقل</p>
            </div>
        </main>

        <footer class="app-footer">
            <span class="free-badge">💚 مهنتي - مجاني للجميع</span>
            <p>تواصل مباشر بين أصحاب المهن والباحثين عنهم</p>
            <p style="margin-top: 8px; opacity: 0.7;">© 2026 مهنتي - جميع الحقوق محفوظة</p>
        </footer>
    </div>

    <script>
        const countryData = {
            JO: { name: "الأردن", cities: ["عمان", "إربد", "الزرقاء", "العقبة", "السلط", "المفرق", "جرش", "مأدبا"] },
            SA: { name: "السعودية", cities: ["الرياض", "جدة", "مكة المكرمة", "المدينة المنورة", "الدمام", "الخبر", "أبها", "تبوك", "بريدة", "الطائف", "حائل"] },
            EG: { name: "مصر", cities: ["القاهرة", "الإسكندرية", "الجيزة", "المنصورة", "طنطا"] },
            AE: { name: "الإمارات", cities: ["دبي", "أبوظبي", "الشارقة", "عجمان"] }
        };

        let allWorkers = [];

        async function fetchWorkers() {
            try {
                const res = await fetch('/api/workers');
                allWorkers = await res.json();
                renderWorkers(allWorkers);
            } catch (err) {
                console.error(err);
                document.getElementById('workersList').innerHTML = '<p style="text-align:center; color:red;">تعذر تحميل البيانات.</p>';
            }
        }

        function renderWorkers(workers) {
            const container = document.getElementById('workersList');
            const noResults = document.getElementById('noResults');
            container.innerHTML = '';

            if (!workers || workers.length === 0) {
                noResults.style.display = 'block';
                return;
            }

            noResults.style.display = 'none';

            workers.forEach(worker => {
                const cleanPhone = (worker.phone || '').replace('+', '');
                const card = document.createElement('div');
                card.className = 'worker-card';
                card.innerHTML = `
                    <div class="worker-header">
                        <div class="worker-name">${worker.name}</div>
                        <div class="worker-job">${worker.job}</div>
                    </div>
                    <div class="worker-info">
                        <span>📍 ${worker.city || ''} ${worker.area ? '(- ' + worker.area + ')' : ''}</span><br>
                        <span>⭐ ${worker.exp || 'خبرة غير محددة'}</span><br>
                        <span>📝 ${worker.desc || 'لا يوجد وصف'}</span>
                    </div>
                    <div class="worker-actions">
                        <a href="https://wa.me/${cleanPhone}" class="btn btn-whatsapp" target="_blank">📱 واتساب</a>
                        <a href="tel:${cleanPhone}" class="btn btn-call">📞 اتصال</a>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function updateCitiesOptions() {
            const country = document.getElementById('countryFilter').value;
            const citySelect = document.getElementById('cityFilter');
            citySelect.innerHTML = '<option value="">📍 جميع المدن</option>';

            if (country && countryData[country]) {
                countryData[country].cities.forEach(city => {
                    const opt = document.createElement('option');
                    opt.value = city;
                    opt.textContent = city;
                    citySelect.appendChild(opt);
                });
            }
            filterWorkers();
        }

        function filterWorkers() {
            const searchVal = document.getElementById('searchInput').value.toLowerCase();
            const selectedCountry = document.getElementById('countryFilter').value;
            const selectedCity = document.getElementById('cityFilter').value;

            const filtered = allWorkers.filter(w => {
                const matchSearch = w.name.toLowerCase().includes(searchVal) || w.job.toLowerCase().includes(searchVal);
                const matchCountry = !selectedCountry || w.country === selectedCountry;
                const matchCity = !selectedCity || w.city === selectedCity;
                return matchSearch && matchCountry && matchCity;
            });

            renderWorkers(filtered);
        }

        document.addEventListener('DOMContentLoaded', () => {
            fetchWorkers();
        });
    </script>
</body>
</html>
