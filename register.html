<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>التسجيل كصاحب مهنة - مهنتي</title>
    <meta name="description" content="سجل بياناتك كصاحب مهنة ليتواصل معك العملاء مباشرة">
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="app-header">
            <div class="logo-icon">📝</div>
            <div class="app-title">التسجيل كصاحب مهنة</div>
            <div class="app-subtitle">سجل بياناتك مجاناً - لا رسوم ولا عمولات</div>
        </header>

        <!-- Navigation -->
        <nav class="nav-tabs">
            <a href="search.html" class="nav-tab">🔍 البحث</a>
            <a href="register.html" class="nav-tab active">📝 التسجيل</a>
            <a href="index.html" class="nav-tab">🏠 الرئيسية</a>
        </nav>

        <!-- Content -->
        <main class="content-area fade-in">
            <div class="card">
                <h2 style="font-size: 18px; margin-bottom: 16px; color: var(--primary-green); display: flex; align-items: center; gap: 8px;">
                    📝 تسجيل جديد
                </h2>

                <form id="registerForm" onsubmit="handleRegister(event)">
                    <!-- الاسم الكامل -->
                    <div class="form-group">
                        <label class="form-label">الاسم الكامل <span style="color:red">*</span></label>
                        <input type="text" class="form-input" id="workerName" placeholder="أدخل اسمك الثلاثي" required>
                    </div>

                    <!-- اختيار الدولة -->
                    <div class="form-group">
                        <label class="form-label">الدولة <span style="color:red">*</span></label>
                        <select class="form-select" id="countrySelect" onchange="onCountryChange()" required>
                            <option value="">اختر الدولة</option>
                            <option value="JO">🇯🇴 الأردن</option>
                            <option value="SA">🇸🇦 السعودية</option>
                            <option value="EG">🇪🇬 مصر</option>
                            <option value="AE">🇦🇪 الإمارات</option>
                        </select>
                    </div>

                    <!-- رقم الجوال مع رمز الدولة التلقائي -->
                    <div class="form-group">
                        <label class="form-label">رقم الجوال / الواتساب <span style="color:red">*</span></label>
                        <div style="display: flex; gap: 8px; dir: ltr;">
                            <span id="phoneCode" style="padding: 10px 14px; background: #f0f0f0; border: 1px solid #ccc; border-radius: 8px; font-weight: bold; display: flex; align-items: center;">+962</span>
                            <input type="tel" class="form-input" id="workerPhone" placeholder="07XXXXXXXX" style="dir: ltr;" required>
                        </div>
                    </div>

                    <!-- المهنة -->
                    <div class="form-group">
                        <label class="form-label">المهنة <span style="color:red">*</span></label>
                        <select class="form-select" id="workerJob" required>
                            <option value="">اختر المهنة</option>
                            <option value="بناء">🧱 بناء - طوب وقصارة</option>
                            <option value="نجار">🪵 نجار - أبواب ودواليب</option>
                            <option value="حداد">🔩 حداد - أبواب حديد</option>
                            <option value="لحام">🔥 لحام - حديد وستانلس</option>
                            <option value="سباك">🔧 سباك - مواسير وصرف</option>
                            <option value="كهربائي">⚡ كهربائي - تركيبات</option>
                            <option value="سائق">🚗 سائق - نقل خفيف/ثقيل</option>
                            <option value="صباغ">🎨 صباغ - دهانات وديكور</option>
                            <option value="بليط">🏠 بليط - سيراميك ورخام</option>
                            <option value="أخرى">📌 أخرى</option>
                        </select>
                    </div>

                    <!-- المدينة -->
                    <div class="form-group">
                        <label class="form-label">المدينة <span style="color:red">*</span></label>
                        <select class="form-select" id="citySelect" required>
                            <option value="">اختر الدولة أولاً</option>
                        </select>
                    </div>

                    <!-- المنطقة / الحي -->
                    <div class="form-group">
                        <label class="form-label">الحي / المنطقة</label>
                        <input type="text" class="form-input" id="workerArea" placeholder="مثال: خلدا / حي النسيم">
                    </div>

                    <!-- سنوات الخبرة -->
                    <div class="form-group">
                        <label class="form-label">سنوات الخبرة</label>
                        <select class="form-select" id="workerExp">
                            <option value="أقل من سنة">أقل من سنة</option>
                            <option value="1-3 سنوات">1-3 سنوات</option>
                            <option value="3-5 سنوات">3-5 سنوات</option>
                            <option value="5-10 سنوات">5-10 سنوات</option>
                            <option value="أكثر من 10 سنوات">أكثر من 10 سنوات</option>
                        </select>
                    </div>

                    <!-- وصف المهنة -->
                    <div class="form-group">
                        <label class="form-label">وصف المهنة والخدمات</label>
                        <textarea class="form-input" id="workerDesc" rows="3" placeholder="اكتب نبذة عن خبراتك وخدماتك..."></textarea>
                    </div>

                    <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; margin-top: 10px;">
                        إرسال وإتمام التسجيل 🚀
                    </button>
                </form>
            </div>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <span class="free-badge">🎁 التسجيل مجاني بالكامل - لا رسوم ولا عمولات</span>
            <p style="margin-top: 8px; opacity: 0.7;">© 2026 مهنتي - جميع الحقوق محفوظة</p>
        </footer>
    </div>

    <script>
        const countryData = {
            JO: { code: "+962", placeholder: "07XXXXXXXX", cities: ["عمان", "إربد", "الزرقاء", "العقبة", "السلط", "المفرق", "جرش", "مأدبا"] },
            SA: { code: "+966", placeholder: "05XXXXXXXX", cities: ["الرياض", "جدة", "مكة المكرمة", "المدينة المنورة", "الدمام", "الخبر", "أبها", "تبوك", "بريدة", "الطائف", "حائل"] },
            EG: { code: "+20", placeholder: "01XXXXXXXXX", cities: ["القاهرة", "الإسكندرية", "الجيزة", "المنصورة", "طنطا"] },
            AE: { code: "+971", placeholder: "05XXXXXXXX", cities: ["دبي", "أبوظبي", "الشارقة", "عجمان"] }
        };

        function onCountryChange() {
            const countrySelect = document.getElementById('countrySelect');
            const citySelect = document.getElementById('citySelect');
            const phoneCode = document.getElementById('phoneCode');
            const phoneInput = document.getElementById('workerPhone');
            const selectedCountry = countrySelect.value;

            citySelect.innerHTML = '<option value="">اختر المدينة</option>';

            if (selectedCountry && countryData[selectedCountry]) {
                const data = countryData[selectedCountry];
                phoneCode.textContent = data.code;
                phoneInput.placeholder = data.placeholder;

                data.cities.forEach(city => {
                    const option = document.createElement('option');
                    option.value = city;
                    option.textContent = city;
                    citySelect.appendChild(option);
                });
            } else {
                phoneCode.textContent = "+--";
                phoneInput.placeholder = "رقم الجوال";
            }
        }

        // دالة التسجيل وإرسال البيانات إلى السيرفر مباشرة
        async function handleRegister(e) {
            e.preventDefault();
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = 'جاري الحفظ... ⏳';

            const workerData = {
                name: document.getElementById('workerName').value,
                country: document.getElementById('countrySelect').value,
                phone: document.getElementById('phoneCode').textContent + document.getElementById('workerPhone').value,
                job: document.getElementById('workerJob').value,
                city: document.getElementById('citySelect').value,
                area: document.getElementById('workerArea').value,
                exp: document.getElementById('workerExp').value,
                desc: document.getElementById('workerDesc').value
            };

            try {
                const response = await fetch('/api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(workerData)
                });

                if (response.ok) {
                    alert('تم التسجيل بنجاح! بياناتك تُحفظ الآن في السيرفر.');
                    window.location.href = 'search.html';
                } else {
                    const err = await response.json();
                    alert('خطأ: ' + (err.error || 'تعذر إتمام التسجيل'));
                }
            } catch (error) {
                console.error(error);
                alert('فشل الاتصال بالسيرفر. يرجى المحاولة لاحقاً.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'إرسال وإتمام التسجيل 🚀';
            }
        }
    </script>
    <script src="js/app.js"></script>
</body>
</html>
