<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Search Workers - Mahanti</title>
  <meta name="description" content="Search for skilled tradespeople in your city">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
</head>
<body>
  <div class="app-container">
    <!-- Language Switcher -->
    <div class="lang-switcher">
      <button class="lang-btn active" onclick="setLang('ar')" data-lang="ar">🇸🇦 العربية</button>
      <button class="lang-btn" onclick="setLang('en')" data-lang="en">🇬🇧 English</button>
    </div>

    <!-- Header -->
    <header class="app-header">
      <div class="logo-icon">🔍</div>
      <div class="app-title" data-i18n="searchWorkers">البحث عن العمال</div>
      <div class="app-subtitle">ابحث بالمهنة أو المدينة أو اسم العامل</div>
    </header>

    <!-- Navigation -->
    <nav class="nav-tabs">
      <a href="search.html" class="nav-tab active" data-i18n="search">🔍 البحث</a>
      <a href="register.html" class="nav-tab" data-i18n="register">📝 التسجيل</a>
      <a href="index.html" class="nav-tab" data-i18n="home">🏠 الرئيسية</a>
    </nav>

    <!-- Content -->
    <main class="content-area fade-in">
      <!-- Country Filter -->
      <div class="form-group" style="margin-bottom: 12px;">
        <select class="form-select" id="countryFilter" onchange="onCountryChange()">
          <option value="" data-i18n="allCountries">🌍 جميع البلدان</option>
        </select>
      </div>

      <!-- Search Box -->
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" placeholder="ابحث باسم المهنة أو العامل..." id="searchInput" oninput="filterWorkers()" data-i18n-placeholder="searchPlaceholder">
      </div>

      <!-- Filter Tags -->
      <div class="filter-tags" id="jobFilters">
        <button class="filter-tag active" onclick="filterByJob('all', this)">الكل</button>
      </div>

      <!-- City Filter -->
      <div class="form-group" style="margin-bottom: 16px;">
        <select class="form-select" id="cityFilter" onchange="filterWorkers()">
          <option value="" data-i18n="allCities">📍 جميع المدن</option>
        </select>
      </div>

      <!-- Workers List -->
      <div id="workersList"></div>
    </main>

    <!-- Footer -->
    <footer class="app-footer">
      <span class="free-badge">💚 Mahanti - Free for Everyone</span>
      <p data-i18n="footer">تواصل مباشر بين أصحاب المهن والباحثين عنهم</p>
      <p style="margin-top: 8px; opacity: 0.7;">© 2026 Mahanti - <span data-i18n="footerRights">جميع الحقوق محفوظة</span></p>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
