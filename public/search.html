<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>البحث عن العمال - مهنتي</title>
  <meta name="description" content="ابحث عن أصحاب المهن الحرفية في مدينتك">
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛠️</text></svg>">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <div class="logo-icon">🔍</div>
      <div class="app-title">البحث عن العمال</div>
      <div class="app-subtitle">ابحث بالمهنة أو المدينة أو اسم العامل</div>
    </header>

    <nav class="nav-tabs">
      <a href="search.html" class="nav-tab active">🔍 البحث</a>
      <a href="register.html" class="nav-tab">📝 التسجيل</a>
      <a href="index.html" class="nav-tab">🏠 الرئيسية</a>
    </nav>

    <main class="content-area fade-in">
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" class="search-input" placeholder="ابحث باسم المهنة أو العامل..." id="searchInput" oninput="filterWorkers()">
      </div>

      <div class="filter-tags">
        <button class="filter-tag active" onclick="filterByJob('all', this)">الكل</button>
        <button class="filter-tag" onclick="filterByJob('بناء', this)">بناء</button>
        <button class="filter-tag" onclick="filterByJob('نجار', this)">نجار</button>
        <button class="filter-tag" onclick="filterByJob('حداد', this)">حداد</button>
        <button class="filter-tag" onclick="filterByJob('لحام', this)">لحام</button>
        <button class="filter-tag" onclick="filterByJob('سباك', this)">سباك</button>
        <button class="filter-tag" onclick="filterByJob('كهربائي', this)">كهربائي</button>
        <button class="filter-tag" onclick="filterByJob('سائق', this)">سائق</button>
        <button class="filter-tag" onclick="filterByJob('صباغ', this)">صباغ</button>
        <button class="filter-tag" onclick="filterByJob('بليط', this)">بليط</button>
      </div>

      <div class="form-group" style="margin-bottom: 16px;">
        <select class="form-select" id="cityFilter" onchange="filterWorkers()">
          <option value="">📍 جميع المدن</option>
          <option value="الرياض">الرياض</option>
          <option value="جدة">جدة</option>
          <option value="مكة">مكة المكرمة</option>
          <option value="المدينة">المدينة المنورة</option>
          <option value="الدمام">الدمام</option>
          <option value="الخبر">الخبر</option>
          <option value="أبها">أبها</option>
          <option value="تبوك">تبوك</option>
          <option value="بريدة">بريدة</option>
          <option value="الطائف">الطائف</option>
          <option value="حائل">حائل</option>
          <option value="نجران">نجران</option>
          <option value="جازان">جازان</option>
          <option value="القصيم">القصيم</option>
          <option value="الأحساء">الأحساء</option>
        </select>
      </div>

      <div id="workersList"></div>
    </main>

    <footer class="app-footer">
      <span class="free-badge">💚 مهنتي - مجاني للجميع</span>
      <p>تواصل مباشر بين أصحاب المهن والباحثين عنهم</p>
      <p style="margin-top: 8px; opacity: 0.7;">© 2026 مهنتي - جميع الحقوق محفوظة</p>
    </footer>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
